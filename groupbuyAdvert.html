<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                height:100vh;
                width:100vw;
                margin:0;
                flex-direction: column;
                background-image: url("images/rocketLaunch.jpg");
                background-color:burlywood;
                background-position: center;
                background-size: cover;
                color:black;
            }
            h1, h2, h3, p{
                text-align: left;
            }
            .rotateThing{
                transform-origin: bottom left;
                transform: rotate(-90deg) translateY(100%);
                width:100%;

            }
            .container{
                height:fit-content;
                width:fit-content;
                position:absolute;
                left:1rem;
                bottom:1rem;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="rotateThing">
                <h1>Groupbuys that are <br>actually affordable.</h1>
                <h2>Quarkle<span style="font-size: 0.5em; vertical-align: top;">™</span> Groupbuy</h2>
            </div>
        </div>
    </body>
</html>
